name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/canvas-py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Scoped to the store module for now: the rest of src has pre-existing
      # findings (mostly auto-fixable) that deserve their own cleanup PR.
      # Widen to `src tests` once that lands.
      - name: Lint
        run: uv run --extra dev ruff check src/langchain_canvas/store src/langchain_canvas/tools.py tests

      - name: Typecheck
        run: uv run --extra dev mypy src

      - name: Test
        run: uv run --extra dev pytest tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm is pinned by "packageManager" in package.json,
      # and passing both makes pnpm/action-setup error on the version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm --filter @braincrew-lab/langchain-canvas test

      - name: Build package
        run: pnpm --filter @braincrew-lab/langchain-canvas build
