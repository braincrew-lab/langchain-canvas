[project]
name = "deepagents-canvas-example"
version = "0.1.0"
description = "langchain-canvas + deepagents on langgraph dev, bridged to the reference web UI."
requires-python = ">=3.11"
dependencies = [
    "langchain-canvas[ingestion]",
    "deepagents>=0.4.3",
    "langchain-aws>=0.2",
    "langgraph-cli[inmem]>=0.4.2",
    "langgraph-sdk>=0.1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "store_server", "doc_check"]

[tool.uv.sources]
langchain-canvas = { path = "../../packages/canvas-py", editable = true }
